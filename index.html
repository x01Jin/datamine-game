<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0d" />
    <title>DATAMINE — data refinery</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080a0d'/%3E%3Cpath d='M16 4 28 16 16 28 4 16Z' fill='none' stroke='%23c9a63c' stroke-width='2'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%23c9a63c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-pause" viewBox="0 0 16 16">
          <path
            d="M5.5 3v10M10.5 3v10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="square"
          />
        </symbol>
        <symbol id="i-play" viewBox="0 0 16 16">
          <path d="M5 3.2 12.4 8 5 12.8Z" fill="currentColor" />
        </symbol>
        <symbol id="i-sound" viewBox="0 0 16 16">
          <path
            d="M2.5 6h2.2L8 3v10L4.7 10H2.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
          <path
            d="M10.4 5.6a3.6 3.6 0 0 1 0 4.8M12.6 3.6a6.6 6.6 0 0 1 0 8.8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-mute" viewBox="0 0 16 16">
          <path
            d="M2.5 6h2.2L8 3v10L4.7 10H2.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
          <path
            d="M10.6 6.2l3.6 3.6M14.2 6.2l-3.6 3.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-sliders" viewBox="0 0 16 16">
          <path d="M2.5 4.5h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.3" />
          <rect
            x="5"
            y="2.9"
            width="2.6"
            height="3.2"
            fill="var(--void)"
            stroke="currentColor"
            stroke-width="1.3"
          />
          <rect
            x="9.2"
            y="9.9"
            width="2.6"
            height="3.2"
            fill="var(--void)"
            stroke="currentColor"
            stroke-width="1.3"
          />
        </symbol>
        <symbol id="i-close" viewBox="0 0 16 16">
          <path
            d="M4 4l8 8M12 4l-8 8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="square"
          />
        </symbol>
        <symbol id="i-fit" viewBox="0 0 16 16">
          <path
            d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
          />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 16 16">
          <rect x="3.5" y="7" width="9" height="6.5" fill="none" stroke="currentColor" stroke-width="1.3" />
          <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.3" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 16 16">
          <path
            d="M3 8h9M9 5l3 3-3 3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="square"
          />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 16 16">
          <path
            d="M3 4.5h10M6.5 4.5V2.5h3v2M4.6 4.5l.7 9h5.4l.7-9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
          />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 16 16">
          <path
            d="M8 3.5v9M3.5 8h9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="square"
          />
        </symbol>
        <symbol id="i-minus" viewBox="0 0 16 16">
          <path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" />
        </symbol>
      </defs>
    </svg>

    <canvas id="board" aria-label="Data refinery board"></canvas>

    <header class="topbar" id="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-text"><b>DATAMINE</b><small>data refinery</small></span>
      </div>
      <div class="bank-rack">
        <div class="bank" id="bank" role="group" aria-label="Banked signal by tier"></div>
        <div class="bank-total" id="bank-total"></div>
      </div>
      <div class="top-actions">
        <div class="net-status" id="net-status">
          <span class="net-dot" aria-hidden="true"></span><span id="net-label">Online</span>
        </div>
        <button class="icon-btn" id="btn-pause" title="Pause (P)" aria-label="Pause simulation">
          <svg aria-hidden="true"><use href="#i-pause"></use></svg>
        </button>
        <button class="icon-btn" id="btn-sound" title="Sound (M)" aria-label="Toggle sound">
          <svg aria-hidden="true"><use href="#i-sound"></use></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
          <svg aria-hidden="true"><use href="#i-sliders"></use></svg>
        </button>
      </div>
    </header>

    <aside class="panel sidebar" id="sidebar" aria-label="Fabrication">
      <div class="tabs" role="tablist" aria-label="Fabrication views">
        <button
          class="tab is-active"
          id="tab-build"
          data-tab="build"
          role="tab"
          aria-selected="true"
          aria-controls="build-view"
          tabindex="0"
        >
          Build
        </button>
        <button
          class="tab"
          id="tab-ops"
          data-tab="ops"
          role="tab"
          aria-selected="false"
          aria-controls="ops-view"
          tabindex="-1"
        >
          Ops
        </button>
        <button
          class="tab"
          id="tab-codex"
          data-tab="codex"
          role="tab"
          aria-selected="false"
          aria-controls="codex-view"
          tabindex="-1"
        >
          Codex
        </button>
        <span class="tab-meta" id="build-count"></span>
        <button class="icon-btn drawer-close" id="sidebar-close" aria-label="Close panel">
          <svg aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>

      <div class="panel-scroll" id="build-view" role="tabpanel" aria-labelledby="tab-build" tabindex="0">
        <div class="section-label">Fabrication</div>
        <div class="build-list" id="build-list"></div>
        <div class="lock-note" id="next-lock"></div>
      </div>

      <div class="panel-scroll" id="ops-view" role="tabpanel" aria-labelledby="tab-ops" tabindex="0" hidden>
        <div class="section-label">Directives</div>
        <div class="dispatch" id="directive-list"></div>
        <div class="section-label">Core exchange</div>
        <div class="core-balance">
          <span class="core-label">Core balance</span>
          <b id="core-balance">0</b>
        </div>
        <div class="core-list" id="core-list"></div>
        <div class="deep-scan">
          <button class="btn btn-block" id="deep-scan" data-action="deep-scan">Deep scan</button>
          <p class="deep-scan-hint" id="deep-scan-hint"></p>
          <p class="archive-note" id="archive-note"></p>
        </div>
      </div>

      <div
        class="panel-scroll"
        id="codex-view"
        role="tabpanel"
        aria-labelledby="tab-codex"
        tabindex="0"
        hidden
      >
        <p class="codex-intro">A record of every signal banked. Recipes appear as they are discovered.</p>
        <div class="codex-list" id="codex-list"></div>
      </div>

      <div class="panel-foot">
        <span id="tier-readout">T00</span>
      </div>
    </aside>

    <aside class="panel inspector" id="inspector" aria-label="Inspector" inert></aside>

    <div class="hint" id="hint" role="status" aria-live="polite">
      <p id="hint-text"></p>
      <button class="hint-close" id="hint-close" aria-label="Hide guidance">
        <svg aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>

    <div class="viewctl" id="viewctl">
      <button id="zoom-in" title="Zoom in" aria-label="Zoom in">
        <svg aria-hidden="true"><use href="#i-plus"></use></svg>
      </button>
      <button id="zoom-out" title="Zoom out" aria-label="Zoom out">
        <svg aria-hidden="true"><use href="#i-minus"></use></svg>
      </button>
      <button id="zoom-fit" title="Fit board (H)" aria-label="Fit board">
        <svg aria-hidden="true"><use href="#i-fit"></use></svg>
      </button>
      <span class="zoom-readout" id="zoom-readout" aria-hidden="true">100%</span>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal-root" id="modal-root"></div>

    <div class="settings" id="settings" role="dialog" aria-label="Instance settings" hidden>
      <div class="settings-head">
        <span>Instance settings</span>
        <button class="icon-btn" id="settings-close" aria-label="Close settings">
          <svg aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <label class="setting-row">
        <span><b>Sound</b><small>Sparse interface tones</small></span>
        <input type="checkbox" id="setting-sound" checked />
      </label>
      <label class="setting-row">
        <span><b>Motion</b><small>Flow particles and ambient animation</small></span>
        <input type="checkbox" id="setting-motion" checked />
      </label>
      <label class="setting-row">
        <span><b>Snap to grid</b><small>Machines and wires share one grid</small></span>
        <input type="checkbox" id="setting-snap" checked />
      </label>
      <button class="btn btn-quiet settings-hints" id="btn-hints">Restore guidance hints</button>
      <div class="settings-actions">
        <button class="btn btn-quiet" id="btn-export">Export save</button>
        <button class="btn btn-quiet" id="btn-import">Import save</button>
      </div>
      <button class="btn btn-danger btn-block" id="btn-reset">Wipe instance</button>
      <p class="settings-foot">Changes save locally in this browser.</p>
    </div>

    <button
      class="drawer-tab"
      id="mobile-build"
      aria-label="Open build panel"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      <svg aria-hidden="true"><use href="#i-arrow"></use></svg><span>Build</span>
    </button>

    <div class="pause-banner" id="pause-banner" role="status" aria-live="polite" hidden>
      <span class="pause-mark" aria-hidden="true"></span>
      <b>Paused</b>
      <small>simulation halted · press P to resume</small>
    </div>

    <footer class="statusbar" id="statusbar">
      <span>
        <span id="node-count">2 nodes</span
        ><span class="status-sep" aria-hidden="true">·</span><span id="link-count">0 links</span>
      </span>
      <span class="grow"></span>
      <span class="save-state" id="save-indicator">
        <span class="save-dot" aria-hidden="true"></span><b id="save-state">Ready</b>
      </span>
    </footer>

    <div class="boot-error" id="boot-error" role="alert" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
